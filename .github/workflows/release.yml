# Publish the Python package to PyPI when a GitHub release is published
# (the same release Zenodo archives). The tag must be v<version>, matching the
# version in python/pyproject.toml, the crates and js/package.json. Wheels are
# built and tested on each platform before anything is published, and PyPI is
# reached through trusted publishing (OIDC), so the repository holds no token.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:   # build and test only: publishing needs a release

permissions:
  contents: read

jobs:
  check:
    name: Tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the versions
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml)
          echo "python/pyproject.toml: $version"
          bad=0
          for f in crates/*/Cargo.toml; do
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' "$f")
            [ "$v" = "$version" ] || { echo "::error file=$f::version $v, not $version"; bad=1; }
          done
          v=$(sed -n 's/^  "version": "\(.*\)",/\1/p' js/package.json)
          [ "$v" = "$version" ] || { echo "::error file=js/package.json::version $v, not $version"; bad=1; }
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but the version is $version (expected v$version)"; bad=1
          fi
          exit $bad

  wheels:
    name: Wheel (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One abi3 wheel per platform (Python 3.13 and later). Wheels built on
          # a runner of their own architecture are installed and tested there.
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto, test: true }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-arm64, runner: macos-latest, target: aarch64, test: true }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64 }
          - { name: windows-x64, runner: windows-latest, target: x64, test: true }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Test the wheel
        if: matrix.test
        shell: bash
        run: |
          python -m pip install python/dist/*.whl pytest
          # From outside the repository, so the installed wheel is imported, not
          # the source tree. Tests that need a catalog build are skipped.
          cd "$RUNNER_TEMP" && python -m pytest -p no:cacheprovider "$GITHUB_WORKSPACE/python/tests"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: python/dist/*.whl

  sdist:
    name: sdist
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: python/dist/*.tar.gz

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
