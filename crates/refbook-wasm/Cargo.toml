[package]
name = "refbook-wasm"
version = "0.0.0"
description = "WebAssembly bindings of refbook-core, for the refbook npm package"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "refbook_wasm"
crate-type = ["cdylib"]

[dependencies]
refbook-core = { path = "../refbook-core" }
wasm-bindgen = "=0.2.130"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
