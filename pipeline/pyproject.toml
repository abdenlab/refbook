# The catalog's pipeline, version 2: one shared catalog built from every book's sources, run by doit
# (pipeline/dodo.py). Built beside the first pipeline (catalog/), which it replaces once its build matches.
[project]
name = "refbook-pipeline"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "refbook[datafusion]",
    "pyarrow>=25",
    "doit>=0.37",
]

[tool.uv]
package = false

[tool.uv.sources]
refbook = { workspace = true }
