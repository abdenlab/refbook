# The GRCh38 book: the GRCh38 assembly, every release (p0..p14), with the add-ons its editions draw on (the hs38d1
# decoys, EBV, the IMGT/HLA alleles), and the published editions its recipes reproduce.
name = "grch38"
assembly = "GRCh38"   # the assembly's name, as its editions record it

# The assembly's releases, p0 first: NCBI assembly sources. Their reports give the members; their structure the
# AGPs, regions and placements.
releases = [
  "GRCh38", "GRCh38.p1", "GRCh38.p2", "GRCh38.p3", "GRCh38.p4", "GRCh38.p5", "GRCh38.p6", "GRCh38.p7",
  "GRCh38.p8", "GRCh38.p9", "GRCh38.p10", "GRCh38.p11", "GRCh38.p12", "GRCh38.p13", "GRCh38.p14",
]
# Other assemblies the book draws on: members too (with their AGPs), but no regions or placements.
addons = ["hs38d1"]
# Every source the book reads: the above, and the rest.
sources = [
  "GRCh38", "GRCh38.p1", "GRCh38.p2", "GRCh38.p3", "GRCh38.p4", "GRCh38.p5", "GRCh38.p6", "GRCh38.p7",
  "GRCh38.p8", "GRCh38.p9", "GRCh38.p10", "GRCh38.p11", "GRCh38.p12", "GRCh38.p13", "GRCh38.p14",
  "GRCh38-withdrawn-fix-patches", "GRCh38-analysis-sets",
  "hs38d1", "EBV", "IMGT-HLA-3.18.0",
  "UCSC-hg38", "Ensembl-116", "GENCODE-50", "Broad-hg38-v0", "1000G-GRCh38", "iGenomes-GRCh38",
]

# Where a release's assembly_regions.txt and genomic_regions_definitions.txt disagree, the definitions are
# authoritative; these are the disagreements known and accepted, each with its reason.
[[region_quirks]]
release = 2
region = "REGION1A"
root = "KI270905.1"
why = "defined, but missing from p2's assembly_regions.txt"

[[region_quirks]]
release = 13
region = "AFCT06"
root = "KI270752.1"
why = "only in p13's assembly_regions.txt; no scaffold is placed in it"

# The GRC's hard-mask (layer_hardmask_grc): the spans its analysis sets replace with N, each an exact duplicate
# of an unmasked cognate. The masked spans on par_root must be exactly its pseudoautosomal regions (in p0).
[hardmask_grc]
source = "GRCh38-analysis-sets"
file = "unmasked_cognates_of_masked_CEN_PAR.txt"
par_root = "CM000686.2"

# Where names come from beyond the assembly reports (aliases.parquet). A chromAlias file gives a namespace's names
# by GenBank accession; a reproduced target gives the names it uses, for its roots that have none in that
# namespace yet (`fill`) or only for its roots outside the book's releases (`outside_releases`: add-ons and loose).
[[aliases]]
namespace = "ensembl"
chromalias = { source = "UCSC-hg38", file = "p14/hg38.p14.chromAlias.txt" }
label = "UCSC hg38.p14.chromAlias.txt"

[[aliases]]
namespace = "ensembl"
targets = ["Ensembl116_primary_assembly", "Ensembl116_toplevel"]
roots = "fill"
label = "Ensembl 116 FASTA (reproduced)"

[[aliases]]
namespace = "ucsc"
targets = ["GRCh38_full_plus_hs38d1_analysis_set"]
roots = "outside_releases"
label = "GRC analysis sets (reproduced)"

# The checks' book-specific choices: the GRC analysis set whose deflines give an M5 for each root (check_roots:
# the full set with hs38d1 covers the decoys and EBV too), and the edition streamed in full (check_materialize).
[checks]
analysis_set = { source = "GRCh38-analysis-sets", file = "GCA_000001405.15_GRCh38_full_plus_hs38d1_analysis_set.fna.gz" }
stream = "grch38-no-alt"
