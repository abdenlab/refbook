# Every source the catalog downloads, declared as data (see refbook_pipeline/sources.py for the keys). One lock
# each, in locks/<name>.lock. A book (books/<book>/book.toml) lists the sources it draws on; a source can serve
# several books.

# GRCh38, p0..p14 (GCA_000001405.15..29): each release's reports, checksums and assembly_structure tree (AGPs,
# placements, alignments, join certificates), without the per-unit FASTA (about 1 GB a release): p14's
# genomic.fna.gz has every sequence but two.

[[source]]
name = "GRCh38"
roles = ["input"]
ncbi_assembly = "ftp.ncbi.nlm.nih.gov/genomes/all/GCA/000/001/405/GCA_000001405.15_GRCh38"

