# The catalog's pipeline: one shared catalog built from every book's sources, run by doit (catalog/dodo.py,
# `uv run doit` from catalog/). Its code is refbook_pipeline/, its tests tests/.
[project]
name = "refbook-catalog"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "refbook[datafusion]",
    "pyarrow>=25",
    "doit>=0.37",
]

[tool.uv]
package = false

[tool.uv.sources]
refbook = { workspace = true }
