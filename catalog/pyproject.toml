# The pipeline that builds, checks and exports the catalog: numbered steps run
# directly (`uv run python -I catalog/<step>.py`, from the repository root),
# with their shared modules and tests (tests/). Not a package.
[project]
name = "refbook-catalog"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "refbook[datafusion]",
    "pyarrow>=25",
]

[tool.uv]
package = false

[tool.uv.sources]
refbook = { workspace = true }
