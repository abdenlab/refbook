[[source]]
name = "GRCh37-structure-archive"
roles = ["input"]
note = """Each GRCh37 release's assembly structure (AGPs, alt scaffold placements, patch types, region definitions), from
NCBI's old_genbank archive: the release directories under genomes/all keep it only for p13. An archived release
directory has the layout of an <asm>_assembly_structure tree, without all_alt_scaffold_placement.txt. Without the
FASTA, RepeatMasker output, alignments and the windowmasker counts. Each release's md5checksums.txt lists only
what that release changed, so a file unchanged since an earlier release is covered by none: the lock covers it,
and layer_agp refuses a root whose AGP differs between releases (p13's current tree included)."""
base = "ftp.ncbi.nlm.nih.gov/genomes/archive/old_genbank/Eukaryotes/vertebrates_mammals/Homo_sapiens"
trees = [
  { path = "GRCh37/", reject = ["index.html*", "*.fa.gz", "*.rm.out.gz", "*.asn", "*.gff", "*.oascii.gz", "README_ANALYSIS_SETS", "*.fna.gz"] },
  { path = "GRCh37.p1/", reject = ["index.html*", "*.fa.gz", "*.rm.out.gz", "*.asn", "*.gff", "*.oascii.gz", "README_ANALYSIS_SETS", "*.fna.gz"] },
  { path = "GRCh37.p2/", reject = ["index.html*", "*.fa.gz", "*.rm.out.gz", "*.asn", "*.gff", "*.oascii.gz", "README_ANALYSIS_SETS", "*.fna.gz"] },
  { path = "GRCh37.p3/", reject = ["index.html*", "*.fa.gz", "*.rm.out.gz", "*.asn", "*.gff", "*.oascii.gz", "README_ANALYSIS_SETS", "*.fna.gz"] },
  { path = "GRCh37.p4/", reject = ["index.html*", "*.fa.gz", "*.rm.out.gz", "*.asn", "*.gff", "*.oascii.gz", "README_ANALYSIS_SETS", "*.fna.gz"] },
  { path = "GRCh37.p5/", reject = ["index.html*", "*.fa.gz", "*.rm.out.gz", "*.asn", "*.gff", "*.oascii.gz", "README_ANALYSIS_SETS", "*.fna.gz"] },
  { path = "GRCh37.p6/", reject = ["index.html*", "*.fa.gz", "*.rm.out.gz", "*.asn", "*.gff", "*.oascii.gz", "README_ANALYSIS_SETS", "*.fna.gz"] },
  { path = "GRCh37.p7/", reject = ["index.html*", "*.fa.gz", "*.rm.out.gz", "*.asn", "*.gff", "*.oascii.gz", "README_ANALYSIS_SETS", "*.fna.gz"] },
