# The repository's uv workspace: the library (python/, the refbook package)
# and the pipeline (pipeline/). One uv.lock and .venv here; `uv sync` installs
# both members and the dev tools. Not a project itself.
[tool.uv.workspace]
members = ["python", "pipeline"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

# tests/ holds the tests that span components (the library and the wasm build
# against a build); python/tests and pipeline/tests each test their own.
[tool.pytest.ini_options]
testpaths = ["tests", "python/tests", "pipeline/tests"]
pythonpath = ["pipeline"]

[tool.ruff.lint.isort]
known-first-party = ["refbook"]
