# The repository's uv workspace: the library (python/, the refbook package),
# the catalog's pipeline (catalog/) and its replacement, built beside it
# (pipeline/). One uv.lock and .venv here; `uv sync` installs every member
# and the dev tools. Not a project itself.
[tool.uv.workspace]
members = ["python", "catalog", "pipeline"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

# Each member tests itself: python/tests the library (against a catalog when
# there is one), catalog/tests the pipeline and everything it produces.
[tool.pytest.ini_options]
testpaths = ["python/tests", "catalog/tests", "pipeline/tests"]
pythonpath = ["catalog", "pipeline"]

[tool.ruff.lint.isort]
known-first-party = ["refbook"]
