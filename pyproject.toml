# The repository's uv workspace: the library (python/, the refbook package)
# and the catalog's pipeline (catalog/). One uv.lock and .venv here; `uv sync` installs
# both members and the dev tools. Not a project itself.
[tool.uv.workspace]
members = ["python", "catalog"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

# tests/ holds the tests that span components (the library and the wasm build
# against a build); python/tests and catalog/tests each test their own.
[tool.pytest.ini_options]
testpaths = ["tests", "python/tests", "catalog/tests"]
pythonpath = ["catalog"]

[tool.ruff.lint.isort]
known-first-party = ["refbook"]
