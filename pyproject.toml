[project]
name = "refbook"
version = "0.0.0"
description = "Catalog of human reference genome sequences: roots, layers and flavor recipes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pyarrow>=25",
]

[project.optional-dependencies]
# Faster fetch: page-index pruning and parallel reads (the engine under polars-bio).
datafusion = ["datafusion>=55"]

[project.scripts]
refbook = "refbook.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

# python/refbook is the library; its Rust core (crates/) and bindings (python/rust/) are built by maturin
# into refbook._core; pipeline/ holds the build steps, run directly with
# `uv run python -I pipeline/<step>.py`.
[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "python/rust/Cargo.toml"
python-source = "python"
module-name = "refbook._core"

[tool.uv]
# Rebuild the extension when the Rust sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "crates/**/*.rs" }, { file = "crates/**/Cargo.toml" }, { file = "python/rust/**/*.rs" }, { file = "python/rust/Cargo.toml" }]
