[project]
name = "refbook"
version = "0.0.0"
description = "Catalog of human reference genome sequences: roots, layers and flavor recipes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pyarrow>=25",
]

[project.optional-dependencies]
# Faster fetch: page-index pruning and parallel reads (the engine under polars-bio).
datafusion = ["datafusion>=55"]

[project.scripts]
refbook = "refbook.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

# src/refbook is the library; pipeline/ holds the build scripts, run
# directly with `uv run python -I pipeline/<script>.py`.
[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
