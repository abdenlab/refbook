# The repository's environment: the pipeline that builds the catalog, and the
# tests and tools. Not a package. The library is python/ (the refbook package,
# a workspace member); pipeline/ holds the build steps, run directly with
# `uv run python -I pipeline/<step>.py`.
[project]
name = "refbook-pipeline"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "refbook[datafusion]",
    "pyarrow>=25",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python"]

[tool.uv.sources]
refbook = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "python/tests"]
