[project]
name = "refbook"
version = "0.1.0"
description = "A catalog of human reference genome editions, and tools to identify, fetch and reconstruct them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Nezar Abdennur" }]
keywords = ["reference genome", "genome assembly", "GRCh38", "T2T-CHM13", "refget", "seqcol", "CRAM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pyarrow>=25",
]

[project.urls]
Homepage = "https://abdenlab.org/refbook/"
Documentation = "https://abdenlab.org/refbook/"
Repository = "https://github.com/abdenlab/refbook"
App = "https://refbook.abdenlab.org/"
Catalog = "https://huggingface.co/datasets/abdenlab/refbook"

[project.optional-dependencies]
# Faster fetch: page-index pruning and parallel reads (the engine under polars-bio).
datafusion = ["datafusion>=55"]

[project.scripts]
refbook = "refbook.cli:main"

# The library (refbook/), with the Rust core (../crates/refbook-core) and its
# pyo3 bindings (../crates/refbook-py) built by maturin into refbook._core.
[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../crates/refbook-py/Cargo.toml"
python-source = "."
module-name = "refbook._core"

[tool.uv]
# Rebuild the extension when the Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "../Cargo.toml" },
    { file = "../crates/**/*.rs" },
    { file = "../crates/**/Cargo.toml" },
]
